name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: UI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run ui:build
        env:
          GITHUB_ACTIONS: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ui
          path: dist-ui/
          retention-days: 3
